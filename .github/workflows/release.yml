name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

env:
  BINARY_NAME: printall

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-pc-windows-msvc
            runner: windows-2025

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "Unsupported release tag: ${GITHUB_REF_NAME}"
            echo "Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rcN"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-
      - name: Install ARM64 Linux linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/${BINARY_NAME}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" "${BINARY_NAME}"
          (cd dist && shasum -a 256 *.tar.gz > SHA256SUMS-${{ matrix.target }}.txt)
      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          7z a "dist/${BINARY_NAME}-${{ github.ref_name }}-${{ matrix.target }}.zip" \
            "target/${{ matrix.target }}/release/${BINARY_NAME}.exe"
          (cd dist && sha256sum *.zip > SHA256SUMS-${{ matrix.target }}.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* \
              --repo "${{ github.repository }}" \
              --clobber
          else
            release_flags=()
            if [[ "${{ github.ref_name }}" == *-rc* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "${{ github.ref_name }}" dist/* \
              --repo "${{ github.repository }}" \
              --verify-tag \
              --title "PrintAll ${{ github.ref_name }}" \
              --generate-notes \
              "${release_flags[@]}"
          fi
